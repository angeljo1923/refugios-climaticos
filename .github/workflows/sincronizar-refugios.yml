name: Sincronizar altas aprobadas y publicar visor

on:
  workflow_dispatch:
  # Apps Script solicita una ejecución al editar y otra diaria como respaldo.
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'malaga_sevilla_4326.geojson'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'iconos/**'
      - 'Logo_financiador.png'
      - 'herramientas/sincronizacion/**'
      - '.github/workflows/sincronizar-refugios.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicacion-refugios
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}

    steps:
      - name: Obtener la versión actual del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar integridad de los archivos públicos
        run: python3 herramientas/comprobar_entrega.py

      - name: Ejecutar pruebas antes de publicar
        run: python3 -m unittest discover -s herramientas/sincronizacion/pruebas -p 'test_*.py' -v

      - name: Incorporar registros aprobados y verificar municipios
        if: github.event_name != 'push'
        env:
          URL_SHEETDB: ${{ secrets.URL_SHEETDB }}
          CABECERA_AUTORIZACION_SHEETDB: ${{ secrets.CABECERA_AUTORIZACION_SHEETDB }}
          URL_WORKER_GEO: ${{ vars.URL_WORKER_GEO }}
          ORIGEN_VISOR: ${{ vars.ORIGEN_VISOR }}
          HOJA_SHEETDB: refugios_nuevos
        run: python3 herramientas/sincronizacion/sincronizar.py

      - name: Guardar nueva capa y FID en Git (solo si cambiaron)
        id: cambios
        shell: bash
        run: |
          if git diff --quiet -- malaga_sevilla_4326.geojson herramientas/sincronizacion/registro_fid.json; then
            echo 'geojson_modificado=no' >> "$GITHUB_OUTPUT"
            echo 'No hay cambios de datos.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- malaga_sevilla_4326.geojson herramientas/sincronizacion/registro_fid.json
            git commit -m 'Sincronizar refugios aprobados por la Universidad'
            git push origin HEAD:main
            echo 'geojson_modificado=si' >> "$GITHUB_OUTPUT"
          fi

      - name: Crear sitio estático para publicar
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.cambios.outputs.geojson_modificado == 'si'
        run: python3 herramientas/sincronizacion/preparar_publicacion.py

      - name: Configurar GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.cambios.outputs.geojson_modificado == 'si'
        uses: actions/configure-pages@v5

      - name: Empaquetar los archivos del visor
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.cambios.outputs.geojson_modificado == 'si'
        uses: actions/upload-pages-artifact@v4
        with:
          path: publicacion

      - name: Publicar el visor en GitHub Pages
        id: publicacion
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.cambios.outputs.geojson_modificado == 'si'
        uses: actions/deploy-pages@v4
