<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Red potencial de refugios climáticos</title>
	<meta name="description" content="Visor cartográfico de refugios climáticos de Málaga y Sevilla.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#003366">

	<!--Hoja de estilos de Leaflet-->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

	<!--Cargar estilos de los plugins antes de los ajustes-->
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
		<link rel="stylesheet" href="css/01-base.css">
	<link rel="stylesheet" href="css/02-tabletas.css">
	<link rel="stylesheet" href="css/03-moviles.css">
	<link rel="stylesheet" href="css/04-horizontal.css">

	<!--Enlace a tipo de letra UBUNTU-->

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="icon" href="data:,">
	
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

</head>
	<body>

	<!--Aquí van los divs del proyecto-->

	<div id="titulo">
  		<img id="logo-izquierdo" src="img/logos.jpeg" alt="Logo institucional">
  		<div class="titulo_centro">
    		<span class="titulo_texto">Red potencial de refugios climáticos</span>
  		</div>
  		<img id="logo-derecho" src="Logo_financiador.png" alt="Financiador">
	</div>

	
	<div id="mapa">

		<!--Botones de localización-->

		<div id="botones-localizacion">

			<button onclick="centrarEnMalaga()">
				<img src="img/malaga.png" class="icono-boton">
				<span>Málaga</span>
			</button>
			<button onclick="centrarEnSevilla()">
				<img src="img/sevilla.png" class="icono-boton">
				<span>Sevilla</span>
			</button>
			<button onclick="volverAlInicio()">Volver al Inicio</button>
			</div>

		<!--Escala personalizada-->
		
		<div id="escala-personalizada">
		<div class="escala-barra"></div>
		<div class="escala-etiqueta">200 m</div>


		</div>

		<!--Capas base-->

		<div id="capasbase">
		<button id="botonpnoa">Foto aérea</button>
		<button id="botonosm">Open Street Map</button>
		<button id="botonesri">ESRI Maps</button>
		</div>

		<!--Botón agregar refugio-->

		<div id="agregarrefugio">
		<button id="botonagregarrefugio">
			<span class="icono">&#x2795</span> Agregar refugio
		</button>
		</div>

		<!--Leyenda y botón asociado-->

		<button
			id="boton-mostrar-leyenda"
			type="button"
			aria-controls="leyenda-refugios"
			aria-expanded="false"
			title="Mostrar leyenda">
			☷ Leyenda
		</button>
		
		<div id="leyenda-refugios" class="oculto" aria-label="Leyenda de símbolos"></div>
		
	</div>

	<div id="encuesta-modal" class="modal modal-oculto">
		<div class="contenido-modal">
			<div id="modal-contenido"></div>
		</div>
	</div>

	<div id="asistente-modal" class="modal modal-oculto">
		<div class="contenido-modal">
			<div id="asistente-contenido"></div>
			<div class="boton-centro">
				<button id="boton-cancelar-asistente" class="boton-enviar">Cancelar</button>
				<button id="boton-siguiente-asistente" class="boton-enviar">Siguiente</button>
				<button id="boton-finalizar-asistente" class="boton-enviar">Finalizar</button>
			</div>
		</div>
	</div>
	
	<div id="pie">

		<div class="pie-izquierda" id="coordenadas_mapa">Coordenadas: </div>

		<div class="pie-centro">
			Jesús Vargas Molina // Germán Pablo Miñón
		</div>

		<div class="pie-derecha" id="fecha_hora"></div>
	</div>

	<!--Aquí el script de leaflet-->
		
	<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
		
	<!--Aquí van los plugins-->

	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

	<!--USER ID Y API DE EMAILJS-->

	<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

	<!--Configuración pública del servicio de altas y protección contra automatizaciones-->
	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
	<script src="js/00-configuracion-servicio.js"></script>

	<!--Aquí el enlace al script del visor-->
		
		<script src="js/01-mapa.js"></script>
	<script src="js/02-tipos-refugio.js"></script>
	<script src="js/03-leyenda.js"></script>
	<script src="js/04-datos-refugios.js"></script>
	<script src="js/05-fichas-refugio.js"></script>
	<script src="js/06-capas-base.js"></script>
	<script src="js/07-pie-mapa.js"></script>
	<script src="js/08-encuestas.js"></script>
	<script src="js/09-navegacion-municipios.js"></script>
	<script src="js/10-alta-refugios.js"></script>
	<script src="js/11-enlaces.js"></script>
	<script src="js/12-ajustes-pantalla.js"></script>

	
	

	
	</body>
</html>
